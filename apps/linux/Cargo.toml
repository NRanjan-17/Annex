[package]
name = "annex-linux"
description = "Annex for Linux: show another computer's screen, share this one, or extend it."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NRanjan-17/Annex"
rust-version = "1.99"
publish = false

[[bin]]
name = "annex"
path = "src/main.rs"

[dependencies]
annex-discovery = { path = "../../core/annex-discovery" }
annex-log = { path = "../../core/annex-log" }
annex-media = { path = "../../core/annex-media" }
annex-proto = { path = "../../core/annex-proto" }
annex-session = { path = "../../core/annex-session" }
annex-update = { path = "../../core/annex-update" }
# Screen sharing and remote input on Wayland desktops with portals (GNOME, KDE, wlroots).
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
async-channel = "2.5"
futures-util = { version = "0.3", default-features = false }
# Finding gtk4-layer-shell's functions once it's preloaded.
if-addrs = "0.15"
libc = "0.2"
# GTK 4.6 and GStreamer 1.20 are the oldest supported (Ubuntu 22.04, JetPack 6, Debian 12, RHEL 9).
gtk = { package = "gtk4", version = "0.10", features = ["v4_6"] }
# X11: the drop island's window (gtk4-x11 ships with GTK 4 itself).
gdk4-x11 = "0.10"
gst = { package = "gstreamer", version = "0.24", features = ["v1_20"] }
gst-app = { package = "gstreamer-app", version = "0.24", features = ["v1_20"] }
gst-video = { package = "gstreamer-video", version = "0.24", features = ["v1_20"] }
# The GTK video sink, built in (Ubuntu 22.04 doesn't package it).
gstgtk4 = { package = "gst-plugin-gtk4", version = "0.14", default-features = false }
ksni = { version = "0.3", default-features = false, features = ["tokio", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1.44"
# wlroots desktops (Raspberry Pi OS): virtual pointer and keyboard, screencopy.
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# X11: XTest for the mouse and keyboard.
x11rb = { version = "0.13", features = ["xtest", "xfixes", "shape"] }
xkbcommon = { version = "0.8", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
