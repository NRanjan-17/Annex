[package]
name = "annex-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
annex-crypto = { path = "../annex-crypto" }
annex-proto = { path = "../annex-proto" }
md5 = { package = "md-5", version = "0.11.0" }
ring = "0.17.14"
rustls-platform-verifier = "0.7.1"
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
tracing = "0.1.44"
futures-util = { version = "0.3.31", default-features = false, features = ["sink"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
