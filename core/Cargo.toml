[workspace]
resolver = "3"
members = [
    "annex-proto",
    "annex-crypto",
    "annex-session",
    "annex-discovery",
    "annex-media-win",
    "annex-ffi",
    "annex-cli",
    "annex-bench", "annex-driver",
    "annex-update",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NRanjan-17/Annex"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
