name: Release

# Tag vX.Y.Z to build signed artifacts and a DRAFT GitHub Release (published manually).
# Run manually (workflow_dispatch) with dry_run=true to build everything without publishing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build all artifacts but do not create a release
        type: boolean
        default: true
      version:
        description: Version to stamp for a dry run (defaults to core/Cargo.toml)
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            PUBLISH=true
          else
            VERSION="${INPUT_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)}"
            PUBLISH=$([[ "$DRY_RUN" == "false" ]] && echo true || echo false)
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, publish=$PUBLISH"

  macos:
    name: macOS universal .dmg
    needs: version
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
          xcodebuild -version
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Stamp version into the Rust core
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/stamp-version.sh "$VERSION"
      - name: Import Developer ID certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::warning::No signing certificate; building ad-hoc signed."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/annex-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "::add-mask::$IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Write notarization key
        if: steps.cert.outputs.signed == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"; fi
      - name: Build, sign, notarize, staple, package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_APPLICATION: ${{ steps.cert.outputs.identity }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/asc_key.p8" ]; then export NOTARY_KEY_PATH="$RUNNER_TEMP/asc_key.p8"; fi
          scripts/package-macos.sh "$VERSION"
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/annex-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - name: Stamp version into the Rust core
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/stamp-version.sh "$VERSION"
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          msbuild-architecture: x64
      - name: Build the Extend-mode driver
        shell: pwsh
        run: drivers/windows/scripts/build.ps1 -Platform $(if ("${{ matrix.arch }}" -eq "arm64") { "ARM64" } else { "x64" }) -Version "${{ needs.version.outputs.version }}"
      - name: Prepare code signing
        id: sign
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if (-not $env:WIN_CERT_PFX) { "::warning::No Windows signing certificate; binaries are unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          "cmd=`"$signtool`" sign /f `"$pfx`" /p %WIN_CERT_PASSWORD% /fd SHA256 /tr http://timestamp.digicert.com /td SHA256" >> $env:GITHUB_OUTPUT
      - name: Build and package
        shell: pwsh
        env:
          ANNEX_SIGN_CMD: ${{ steps.sign.outputs.cmd }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Version "${{ needs.version.outputs.version }}"
      - name: Clean up signing material
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "sign.pfx")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/Annex-Setup-*.exe
          if-no-files-found: error

  linux:
    name: Linux packages (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported system so the binary runs on everything newer.
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK 4, GStreamer and packaging tools
        run: |
          sudo apt-get update -qq
          # The runner image ships libunwind-14-dev, which conflicts with the libunwind-dev that
          # libgstreamer1.0-dev needs ("held broken packages").
          sudo apt-get remove -y -qq libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxkbcommon-dev libdbus-1-dev pkg-config rpm
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Stamp version into the Rust core
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/stamp-version.sh "$VERSION"
      - name: Build and package (.deb, .rpm, .tar.gz)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/package-linux.sh "$VERSION"
      - name: Install the .deb and start it
        run: |
          sudo apt-get install -y -qq ./dist/*.deb
          annex --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/Annex-*-linux-*
          if-no-files-found: error

  publish:
    name: Checksums, SBOM, release
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    # The update-signing key lives in the protected environment.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SBOMs (SPDX) per artifact
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The macOS app's only third-party code is the Rust core.
          path: core
          format: spdx-json
          output-file: dist/Annex-${{ needs.version.outputs.version }}-macos-universal.dmg.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: "SBOM (Windows: Rust core + NuGet)"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/Annex-Setup-${{ needs.version.outputs.version }}-windows.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: "SBOM (Linux: Rust core + app)"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: apps/linux
          format: spdx-json
          output-file: dist/Annex-${{ needs.version.outputs.version }}-linux.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign checksums for in-app updates
        working-directory: dist
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # Annex installs an update only if this Ed25519 signature verifies against the public key
          # built into the app (core/annex-update). The key is written to a private temp file and
          # deleted; it is never printed.
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY isn't set: in-app updates won't offer this release."
            exit 0
          fi
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          expected="$(sed -n 's/.*hex_key("\([0-9a-f]\{64\}\)").*/\1/p' "$GITHUB_WORKSPACE/core/annex-update/src/lib.rs")"
          actual="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d " \n")"
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "::error::UPDATE_SIGNING_KEY doesn't match the public key in the app"; exit 1; }
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          openssl pkey -in "$key" -pubout -out pub.pem
          openssl pkeyutl -verify -pubin -inkey pub.pem -rawin -in SHA256SUMS.txt -sigfile SHA256SUMS.txt.sig
          rm -f pub.pem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/
      - name: Create release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Hand-written notes for this version, if any, come first.
          : > notes.md
          if [[ -f "docs/releases/v$VERSION.md" ]]; then cat "docs/releases/v$VERSION.md" >> notes.md; fi
          cat >> notes.md <<'NOTES'
          > Built by CI from this tag. Installation steps: see the README.

          **Windows Extend-mode driver:** optional in the installer (off by default). The installer signs it on your PC
          with a one-off certificate whose private key is deleted right away, so it loads without test signing.

          **Linux:** `.deb` (Ubuntu, Debian, Raspberry Pi OS, JetPack, Mint), `.rpm` (Fedora, RHEL, openSUSE) and
          `.tar.gz`, for x86_64 and arm64. Install with `sudo apt install ./Annex-…-linux-<cpu>.deb` or
          `sudo dnf install ./Annex-…-linux-<cpu>.rpm`. Video needs the system's H.264 codecs: see docs/LINUX.md.

          **Signing:** the Mac app is signed with a Developer ID and notarized by Apple, so it opens without
          warnings. The Windows installer isn't code-signed yet, so SmartScreen may warn the first time:
          click **More info → Run anyway**. Annex checks every in-app update against `SHA256SUMS.txt.sig`.
          NOTES
          # Pre-release tags (v1.2.3-pre.1) are published as GitHub pre-releases right away so testers can
          # download them; stable versions stay drafts until checked and published by hand.
          if [[ "$VERSION" == *-* ]]; then KIND=(--prerelease); else KIND=(--draft); fi
          gh release create "v$VERSION" dist/* "${KIND[@]}" --generate-notes --notes-file notes.md --title "Annex $VERSION" \
            --verify-tag
