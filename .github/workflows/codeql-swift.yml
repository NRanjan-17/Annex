name: CodeQL (Swift)

# Swift analysis needs a full, clean Xcode build on a macOS runner (CodeQL extracts from the
# compiler), which also builds the Rust core. So it runs only when the Mac app changes, and
# weekly, instead of on every push.
on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - ".github/workflows/codeql-swift.yml"
  pull_request:
    paths:
      - "apps/macos/**"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (swift)
    runs-on: macos-latest
    # Swift support lags new Xcode releases; a failure here shouldn't block anything.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      - name: Build (one architecture, clean, no explicit modules)
        run: |
          rustup show active-toolchain || rustup toolchain install
          # CodeQL can't follow explicit module builds or skipped (incremental) sources; one
          # architecture is enough for analysis and halves the Rust build.
          xcodebuild clean build -project apps/macos/Annex.xcodeproj -scheme Annex -destination 'platform=macOS' \
            -derivedDataPath apps/macos/build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
