name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded runs on PRs/branches are cancelled; every push to main gets a complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        # Stream test output live so a native crash still shows how far a test got.
        env:
          RUST_TEST_NOCAPTURE: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo test --workspace --locked

  bench:
    name: Loopback latency benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            core/target
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock') }}
          restore-keys: cargo-bench-${{ runner.os }}-
      - name: Run benchmark
        working-directory: core
        # Generous ceiling: shared runners are noisy; this catches regressions by orders of magnitude.
        run: cargo run --release --locked -p annex-bench -- --frames 600 --out ../bench-results --max-p95-ms 25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: error

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          XCODE="/Applications/Xcode_$(cat .xcode-version).app"
          if [ -d "$XCODE" ]; then sudo xcode-select -s "$XCODE"; else echo "::warning::$XCODE not found, using default"; fi
          xcodebuild -version
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            core/target
            ~/Library/Caches/org.swift.swiftpm
          key: macos-app-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock', '.xcode-version') }}
          restore-keys: macos-app-
      - name: Build and test
        run: |
          xcodebuild test -project apps/macos/Annex.xcodeproj -scheme Annex \
            -destination 'platform=macOS' -derivedDataPath apps/macos/build/DerivedData \
            -resultBundlePath apps/macos/build/TestResults.xcresult
      - name: Package unsigned universal .dmg
        run: scripts/package-macos.sh "0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg-unsigned
          path: dist/*.dmg*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: macos-test-results
          path: apps/macos/build/TestResults.xcresult

  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            core/target
          key: windows-app-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock') }}
          restore-keys: windows-app-
      - name: Build Rust core (x64)
        run: cargo build --manifest-path core/Cargo.toml -p annex-ffi --locked --target x86_64-pc-windows-msvc
      - name: Interop tests (against annex_ffi.dll)
        env:
          ANNEX_NATIVE_DIR: ${{ github.workspace }}\core\target\x86_64-pc-windows-msvc\debug
        run: dotnet test apps/windows/tests/Annex.Interop.Tests -p:RestoreLockedMode=true
      - name: Build WinUI app (x64)
        run: dotnet build apps/windows/src/Annex.App -p:Platform=x64 -p:RestoreLockedMode=true
      - name: Package installer (x64)
        shell: pwsh
        run: scripts/package-windows.ps1 -Arch x64 -Version "0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-unsigned
          path: dist/Annex-Setup-*

  audit:
    name: Supply chain (cargo audit + cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny (advisories, licenses, bans, sources)
        working-directory: core
        run: cargo deny check
      - name: cargo audit
        working-directory: core
        run: cargo audit
