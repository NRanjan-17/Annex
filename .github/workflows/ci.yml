name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded runs on PRs/branches are cancelled; every push to main gets a complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        # Stream test output live so a native crash still shows how far a test got.
        env:
          RUST_TEST_NOCAPTURE: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo test --workspace --locked

  bench:
    name: Loopback latency benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            core/target
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock') }}
          restore-keys: cargo-bench-${{ runner.os }}-
      - name: Run benchmark
        working-directory: core
        # Generous ceiling: shared runners are noisy; this catches regressions by orders of magnitude.
        run: cargo run --release --locked -p annex-bench -- --frames 600 --out ../bench-results --max-p95-ms 25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: error

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          XCODE="/Applications/Xcode_$(cat .xcode-version).app"
          if [ -d "$XCODE" ]; then sudo xcode-select -s "$XCODE"; else echo "::warning::$XCODE not found, using default"; fi
          xcodebuild -version
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            core/target
            ~/Library/Caches/org.swift.swiftpm
          key: macos-app-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock', '.xcode-version') }}
          restore-keys: macos-app-
      - name: Build and test
        run: |
          # CI has no Apple account: sign ad hoc, overriding the project's automatic signing.
          xcodebuild test -project apps/macos/Annex.xcodeproj -scheme Annex \
            -destination 'platform=macOS' -derivedDataPath apps/macos/build/DerivedData \
            -resultBundlePath apps/macos/build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Package unsigned universal .dmg
        run: scripts/package-macos.sh "0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg-unsigned
          path: dist/*.dmg*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: macos-test-results
          path: apps/macos/build/TestResults.xcresult

  linux-app:
    name: Linux app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported system (GTK 4.6, GStreamer 1.20, glibc 2.35).
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK 4, GStreamer and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxkbcommon-dev libdbus-1-dev pkg-config rpm
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/linux/target
          key: cargo-linux-app-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'apps/linux/Cargo.lock', 'core/Cargo.lock') }}
          restore-keys: cargo-linux-app-${{ matrix.arch }}-
      - name: rustfmt
        working-directory: apps/linux
        run: cargo fmt --check
      - name: clippy
        working-directory: apps/linux
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        working-directory: apps/linux
        run: cargo test --locked
      - name: Package (.deb, .rpm, .tar.gz)
        run: scripts/package-linux.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)"
      - name: Install the .deb and start it
        run: |
          sudo apt-get install -y -qq ./dist/*.deb
          annex --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/Annex-*-linux-*
          if-no-files-found: error

  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            core/target
          key: windows-app-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock') }}
          restore-keys: windows-app-
      - name: Build Rust core (x64)
        run: cargo build --manifest-path core/Cargo.toml -p annex-ffi --locked --target x86_64-pc-windows-msvc
      - name: Interop tests (against annex_ffi.dll)
        env:
          ANNEX_NATIVE_DIR: ${{ github.workspace }}\core\target\x86_64-pc-windows-msvc\debug
        run: dotnet test apps/windows/tests/Annex.Interop.Tests -p:RestoreLockedMode=true
      - name: Build WinUI app (x64)
        run: dotnet build apps/windows/src/Annex.App -p:Platform=x64 -p:RestoreLockedMode=true
      # The Extend-mode driver goes into the installer too, so the smoke test can install it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: drivers/windows/packages
          key: wdk-${{ hashFiles('drivers/windows/packages.config') }}
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          msbuild-architecture: x64
      - name: Build the Extend-mode driver (x64)
        shell: pwsh
        run: drivers/windows/scripts/build.ps1 -Platform x64
      - name: Package installer (x64)
        shell: pwsh
        run: scripts/package-windows.ps1 -Arch x64 -Version "0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-unsigned
          path: dist/Annex-Setup-*
      # Installs the real installer and launches Annex the way a user would: it must start, keep
      # responding and show its window. Logs, stacks and a screenshot are kept either way.
      - name: Smoke test (install and launch)
        timeout-minutes: 12
        shell: pwsh
        run: scripts/dev/smoke-windows.ps1 -Installer (Get-ChildItem dist/Annex-Setup-*-x64.exe).FullName -OutDir smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-smoke-test
          path: smoke/
          if-no-files-found: ignore

  windows-driver:
    name: Windows virtual display driver (build only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: drivers/windows/packages
          key: wdk-${{ hashFiles('drivers/windows/packages.config') }}
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          # The WDK NuGet package ships stampinf only for x64/ARM64 hosts.
          msbuild-architecture: x64
      - name: EDID unit tests (MSVC)
        shell: cmd
        working-directory: drivers/windows/AnnexIdd/tests
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /I.. EdidTest.cpp ..\Edid.cpp /Fe:EdidTest.exe || exit /b 1
          EdidTest.exe
      - name: Build x64
        shell: pwsh
        run: drivers/windows/scripts/build.ps1 -Platform x64
      - name: Build ARM64
        shell: pwsh
        run: drivers/windows/scripts/build.ps1 -Platform ARM64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: annex-idd-unsigned
          path: drivers/windows/out/

  rendezvous:
    name: Rendezvous server (Worker + Rust client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/rendezvous/package-lock.json
      - name: Install
        working-directory: server/rendezvous
        run: npm ci
      - name: Typecheck
        working-directory: server/rendezvous
        run: npx wrangler types && npx tsc --noEmit && npx tsc --noEmit -p test
      - name: Worker tests
        working-directory: server/rendezvous
        run: npx vitest run
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Rust client against the Worker (wrangler dev)
        shell: bash
        run: |
          (cd server/rendezvous && npx wrangler dev --port 8788 > ../../wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8788/ >/dev/null && break; sleep 1; done
          cd core && ANNEX_RENDEZVOUS=ws://127.0.0.1:8788 cargo test -p annex-session --test rendezvous
      - if: failure()
        run: cat wrangler.log || true

  audit:
    name: Supply chain (cargo audit + cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny (advisories, licenses, bans, sources)
        working-directory: core
        run: cargo deny check
      - name: cargo audit
        working-directory: core
        run: cargo audit
